name: Interface checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/dark-admin-archive.cjs
        env:
          PLAYWRIGHT_CHANNEL: chromium
